version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: renova-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-renova_dev}
      POSTGRES_USER: ${POSTGRES_USER:-renova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-renova}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U renova"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: renova-backend
    volumes:
      - ./backend:/app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-renova}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-renova}
      DB_NAME: ${POSTGRES_DB:-renova_dev}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: 24h
      SERVER_PORT: 8080
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: renova-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
